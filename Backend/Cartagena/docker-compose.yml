name: cartagena-csharp

# ---------------------------------------------------------------------------
# Modo Docker.
#
# La base de datos NO se levanta aqui: se reutiliza la instancia MySQL que ya
# existe (contenedor `mysql-cartagena`, publicado en 127.0.0.1:3307).
#
# Requisitos (los hace `./start-docker.sh` automaticamente):
#   1. docker network create libreria-network
#   2. docker network connect --alias mysql libreria-network mysql-cartagena
#
# Dentro de la red los servicios hablan con MySQL como `mysql:3306`; el
# `.env` (DB_HOST/DB_PORT) solo aplica cuando ejecutas los backends nativos.
# ---------------------------------------------------------------------------
services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - '${GATEWAY_PORT:-8081}:80'
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - login
      - libreria-core
      - resenas
      - proveedores
      - historial-compras
    networks: [default, libreria-network]
    restart: unless-stopped

  # Backend principal, reimplementado en ASP.NET Core 10.
  # Conservamos el nombre de servicio para no romper las rutas internas de Nginx.
  libreria-core:
    build: ./backend/Cartagena.Api
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-tienda_online}
      JWT_ISSUER: ${JWT_ISSUER:-microservicio-login}
      LIBROS_PDF_DIR: /data/pdfs
    ports:
      # El frontend en desarrollo apunta aqui (VITE_API_PROXY_TARGET).
      - '127.0.0.1:${DOTNET_PORT:-8083}:8080'
    volumes:
      - libros_pdf:/data/pdfs
    networks: [default, libreria-network]
    restart: unless-stopped

  login:
    build: ./servicios/microservicio-login
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: '3000'
      API_PREFIX: /api/v1
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-tienda_online}
      HTTPS_ENABLED: 'false'
    ports:
      # Publicado para que Vite pueda hacer proxy de /api/v1 sin el gateway.
      - '127.0.0.1:${LOGIN_PORT:-3000}:3000'
    networks: [default, libreria-network]
    restart: unless-stopped

  proveedores:
    build: ./servicios/proveedores
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-tienda_online}
    networks: [default, libreria-network]
    restart: unless-stopped

  resenas:
    build: ./servicios/comentarios-resenas-service
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-tienda_online}
    networks: [default, libreria-network]
    restart: unless-stopped

  historial-compras:
    build: ./servicios/historial-compras
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-tienda_online}
      JWT_ISSUER: ${JWT_ISSUER:-microservicio-login}
    networks: [default, libreria-network]
    restart: unless-stopped

  migrador:
    profiles: [tools]
    build: ./backend/Cartagena.Migrator
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-tienda_online}
    networks: [default, libreria-network]
    restart: 'no'

networks:
  default:
  libreria-network:
    external: true

volumes:
  libros_pdf:
